<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星辰 · 下载最新版</title>
<script>
fetch('https://api.github.com/repos/XingChenApp/xingchen/releases/latest')
  .then(function (r) { return r.json(); })
  .then(function (rel) {
    var apk = (rel.assets || []).filter(function (a) { return /\.apk$/i.test(a.name); })[0];
    if (apk) { location.replace(apk.browser_download_url); }
    else { location.replace('https://github.com/XingChenApp/xingchen/releases'); }
  })
  .catch(function () {
    location.replace('https://github.com/XingChenApp/xingchen/releases');
  });
</script>
</head>
<body>
<p>正在获取最新版…如未自动跳转，点 <a href="https://github.com/XingChenApp/xingchen/releases">发布页</a> 下载。</p>
</body>
</html>
