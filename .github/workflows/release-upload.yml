name: release-upload-once
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 14078380021
          path: art
      - name: Upload APK to release v1.4.130
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find art -name "*.apk"
          cp "$(find art -name '*.apk' | head -1)" ./xingchen-arm64_v8a-1.4.130.apk
          ls -la ./xingchen-arm64_v8a-1.4.130.apk
          gh release upload v1.4.130 ./xingchen-arm64_v8a-1.4.130.apk --repo XingChenApp/xingchen
