name: Build XingChen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone webhtv source
        run: |
          git clone --depth 1 https://github.com/webhtv/webhtv.git webhtv-src
          ls webhtv-src/

      - name: Apply basic renames
        run: |
          cd webhtv-src
          sed -i 's/applicationId "com.fongmi.android.tv"/applicationId "com.xingchen.tv"/' app/build.gradle
          sed -i 's/versionCode 560/versionCode 2/' app/build.gradle
          sed -i 's/versionName "5.6.0"/versionName "1.0.1"/' app/build.gradle
          sed -i 's/<string name="app_name">TV<\/string>/<string name="app_name">星辰<\/string>/' app/src/main/res/values/strings.xml
          sed -i 's/<string name="app_name">影视<\/string>/<string name="app_name">星辰<\/string>/' app/src/main/res/values-zh-rCN/strings.xml

      - name: Fix status bar (solid cream, Android 16)
        run: |
          cd webhtv-src
          python3 << 'PYEOF'
          # Fix 1: styles.xml - change transparent to solid cream
          p = 'app/src/mobile/res/values/styles.xml'
          c = open(p, encoding='utf-8').read()
          if 'XC_STATUSBAR_FIX' not in c:
              old = '<item name="android:statusBarColor">@color/transparent</item>'
              new = '<!-- XC_STATUSBAR_FIX -->\n        <item name="android:statusBarColor">#F5F0E8</item>\n        <item name="android:windowLightStatusBar">true</item>'
              c = c.replace(old, new, 1)
              open(p, 'w', encoding='utf-8').write(c)
              print("styles.xml: status bar -> solid cream")
          else:
              print("styles.xml: already fixed")
          # Fix 2: AndroidManifest.xml - opt out of edge-to-edge
          m = 'app/src/mobile/AndroidManifest.xml'
          mc = open(m, encoding='utf-8').read()
          if 'windowOptOutEdgeToEdgeEnforcement' not in mc:
              mc = mc.replace('<activity android:name=".ui.activity.HomeActivity"',
                              '<activity android:name=".ui.activity.HomeActivity"\n            android:windowOptOutEdgeToEdgeEnforcement="true"')
              open(m, 'w', encoding='utf-8').write(mc)
              print("AndroidManifest.xml: opt-out edge-to-edge")
          else:
              print("AndroidManifest.xml: already fixed")
          PYEOF

      - name: Fix bottom bar (4 tabs, transparent capsule)
        run: |
          cd webhtv-src
          # Create 4 icons
          mkdir -p app/src/mobile/res/drawable
          cat > app/src/mobile/res/drawable/ic_nav_home.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24" android:tint="?attr/colorControlNormal">
            <path android:fillColor="@android:color/white" android:pathData="M3,10.5L12,3l9,7.5V20a1,1 0,0 1,-1 1h-5v-6h-6v6H4a1,1 0,0 1,-1 -1z" android:strokeWidth="2" android:strokeColor="#8A8A8A" android:fillType="evenOdd"/>
          </vector>
          EOF
          cat > app/src/mobile/res/drawable/ic_nav_live.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="none" android:strokeColor="#8A8A8A" android:strokeWidth="2" android:pathData="M4,7h16v10H4z M4,7l2,-3h12l2,3 M9,11l5,3l-5,3z"/>
          </vector>
          EOF
          cat > app/src/mobile/res/drawable/ic_nav_reading.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="none" android:strokeColor="#8A8A8A" android:strokeWidth="2" android:pathData="M4,5a2,2 0,0 1,2 -2h13v16H6a2,2 0,0 0,-2 2z M4,19a2,2 0,0 1,2 -2h13"/>
          </vector>
          EOF
          cat > app/src/mobile/res/drawable/ic_nav_setting.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="none" android:strokeColor="#8A8A8A" android:strokeWidth="2" android:pathData="M12,15a3,3 0,1 0,0 -6a3,3 0,0 0,0 6z M19.4,15a1.65,1.65 0,0 0,.33 1.82l.06,.06a2,2 0,1 1,-2.83 2.83l-.06,-.06a1.65,1.65 0,0 0,-1.82 -.33a1.65,1.65 0,0 0,-1 1.51V21a2,2 0,1 1,-4 0v-.09a1.65,1.65 0,0 0,-1 -1.51a1.65,1.65 0,0 0,-1.82 .33l-.06,.06a2,2 0,1 1,-2.83 -2.83l.06,-.06a1.65,1.65 0,0 0,.33 -1.82a1.65,1.65 0,0 0,-1.51 -1H3a2,2 0,1 1,0 -4h.09a1.65,1.65 0,0 0,1.51 -1a1.65,1.65 0,0 0,-.33 -1.82l-.06,-.06a2,2 0,1 1,2.83 -2.83l.06,.06a1.65,1.65 0,0 0,1.82 .33h.09a1.65,1.65 0,0 0,1 -1.51V3a2,2 0,1 1,4 0v.09a1.65,1.65 0,0 0,1 1.51h.09a1.65,1.65 0,0 0,1.82 -.33l.06,-.06a2,2 0,1 1,2.83 2.83l-.06,.06a1.65,1.65 0,0 0,-.33 1.82v.09a1.65,1.65 0,0 0,1.51 1H21a2,2 0,1 1,0 4h-.09a1.65,1.65 0,0 0,-1.51 1z"/>
          </vector>
          EOF
          echo "4 icons created"
          # Create capsule background
          cat > app/src/mobile/res/drawable/xc_bottombar_pill.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <corners android:radius="28dp"/>
              <solid android:color="#E6F5F0E8"/>
              <stroke android:width="1dp" android:color="#FFE0D5C0"/>
          </shape>
          EOF
          # Update menu to 4 tabs
          python3 << 'PYEOF'
          p = 'app/src/mobile/res/menu/menu_nav.xml'
          c = open(p, encoding='utf-8').read()
          if 'XC_MENU_FIX' not in c:
              # Rewrite menu with 4 items
              new_menu = '''<?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- XC_MENU_FIX -->
              <item android:id="@+id/vod" android:icon="@drawable/ic_nav_home" android:title="@string/nav_vod" />
              <item android:id="@+id/live" android:icon="@drawable/ic_nav_live" android:title="@string/nav_live" />
              <item android:id="@+id/reading" android:icon="@drawable/ic_nav_reading" android:title="@string/nav_reading" />
              <item android:id="@+id/setting" android:icon="@drawable/ic_nav_setting" android:title="@string/nav_setting" />
          </menu>'''
              open(p, 'w', encoding='utf-8').write(new_menu)
              print("menu: 4 tabs created")
              # Add nav_reading string
              for lang in ['', '-zh-rCN', '-zh-rTW']:
                  sp = f'app/src/mobile/res/values{lang}/strings.xml'
                  try:
                      sc = open(sp, encoding='utf-8').read()
                      if 'nav_reading' not in sc:
                          text = '阅读' if lang != '-zh-rTW' else '閱讀'
                          sc = sc.replace('</resources>', f'    <string name="nav_reading">{text}</string>\n</resources>')
                          open(sp, 'w', encoding='utf-8').write(sc)
                          print(f"strings{lang}: nav_reading added")
                  except: pass
          else:
              print("menu: already fixed")
          PYEOF
          # Apply capsule style to BottomNavigationView
          python3 << 'PYEOF'
          p = 'app/src/mobile/res/layout/activity_home.xml'
          c = open(p, encoding='utf-8').read()
          if 'xc_bottombar_pill' not in c:
              import re
              c = re.sub(
                  r'(<com\.google\.android\.material\.bottomnavigation\.BottomNavigationView[^>]*?)>',
                  r'\1\n        android:layout_marginLeft="24dp"\n        android:layout_marginRight="24dp"\n        android:layout_marginBottom="16dp"\n        android:background="@drawable/xc_bottombar_pill"\n        app:labelVisibilityMode="labeled"\n        android:elevation="8dp" >',
                  c, count=1
              )
              open(p, 'w', encoding='utf-8').write(c)
              print("activity_home.xml: capsule applied")
          else:
              print("activity_home.xml: already fixed")
          PYEOF

      - name: Build APK
        run: |
          cd webhtv-src
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --parallel 2>&1 | tail -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: webhtv-src/app/build/outputs/apk/mobile/arm64_v8a/release/*.apk
