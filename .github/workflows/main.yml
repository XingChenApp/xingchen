name: Build XingChen APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          git clone --depth 1 https://github.com/webhtv/webhtv.git /tmp/webhtv-src
          echo "Source cloned"
      - name: Download app icons
        run: |
          curl -L -o /tmp/icons.zip "https://muse.ai/files/1392977643892470/1423151855987498/w5hsnxpzh2wycxzt12qztve4/xingchen-icons.zip"
          mkdir -p /tmp/icons
          unzip -q -o /tmp/icons.zip -d /tmp/icons
          find /tmp/webhtv-src/app/src/main/res -name "ic_launcher*" -delete
          cp -r /tmp/icons/* /tmp/webhtv-src/app/src/main/res/
          echo "App icons installed"
      - name: Download nav icons
        run: |
          curl -L -o /tmp/nav_icons.zip "https://muse.ai/files/1392977643892470/3305432652981077/0kuj55hp9c2oxrpcbrdsefqp/xingchen-nav-icons.zip"
          mkdir -p /tmp/nav_icons
          unzip -q -o /tmp/nav_icons.zip -d /tmp/nav_icons
          echo "Nav icons downloaded"
      - name: Download clean patch
        run: |
          curl -L -o /tmp/clean_patch.py "https://muse.ai/files/1392977643892470/1410939860753595/3wp77zma2j8tkbsgq9abdtnb/xingchen-clean-patch.py"
          echo "Clean patch downloaded"
      - name: Apply clean patch
        run: |
          python3 /tmp/clean_patch.py
          echo "Clean patch applied"
      - name: Install nav icons
        run: |
          cp /tmp/nav_icons/drawable/* /tmp/webhtv-src/app/src/mobile/res/drawable/
          echo "Nav icons installed"
          ls /tmp/webhtv-src/app/src/mobile/res/drawable/ic_nav_*
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build APK
        run: |
          cd /tmp/webhtv-src
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: /tmp/webhtv-src/app/build/outputs/apk/mobileArm64_v8a/release/*.apk
