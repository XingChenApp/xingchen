name: Build XingChen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone webhtv source
        run: |
          git clone --depth 1 https://github.com/webhtv/webhtv.git webhtv-src

      - name: Basic renames
        run: |
          cd webhtv-src
          sed -i 's/applicationId "com.fongmi.android.tv"/applicationId "com.xingchen.tv"/' app/build.gradle
          sed -i 's/versionCode 560/versionCode 2/' app/build.gradle
          sed -i 's/versionName "5.6.0"/versionName "1.0.1"/' app/build.gradle
          sed -i 's/<string name="app_name">TV<\/string>/<string name="app_name">星辰<\/string>/' app/src/main/res/values/strings.xml
          sed -i 's/<string name="app_name">影视<\/string>/<string name="app_name">星辰<\/string>/' app/src/main/res/values-zh-rCN/strings.xml

      - name: Status bar solid cream
        run: |
          cd webhtv-src
          # Replace transparent with solid cream in styles.xml (single sed, no append)
          sed -i 's|<item name="android:statusBarColor">@color/transparent</item>|<item name="android:statusBarColor">#F5F0E8</item><item name="android:windowLightStatusBar">true</item>|' app/src/mobile/res/values/styles.xml
          echo "Status bar fixed"

      - name: Bottom bar 4 tabs
        run: |
          cd webhtv-src
          # Create reading icon (simple book)
          mkdir -p app/src/mobile/res/drawable
          cat > app/src/mobile/res/drawable/ic_nav_reading.xml << 'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="none" android:strokeColor="#8A8A8A" android:strokeWidth="2" android:pathData="M4,5a2,2 0,0 1,2 -2h13v16H6a2,2 0,0 0,-2 2z"/>
          </vector>
          EOF
          # Update menu to 4 tabs
          cat > app/src/mobile/res/menu/menu_nav.xml << 'MENUEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/vod" android:icon="@drawable/ic_nav_home" android:title="@string/nav_vod" />
              <item android:id="@+id/live" android:icon="@drawable/ic_nav_live" android:title="@string/nav_live" />
              <item android:id="@+id/reading" android:icon="@drawable/ic_nav_reading" android:title="@string/nav_reading" />
              <item android:id="@+id/setting" android:icon="@drawable/ic_nav_setting" android:title="@string/nav_setting" />
          </menu>
          MENUEOF
          echo "Menu updated to 4 tabs"
          # Add nav_reading string
          sed -i 's|</resources>|    <string name="nav_reading">阅读</string>\n</resources>|' app/src/mobile/res/values/strings.xml
          sed -i 's|</resources>|    <string name="nav_reading">阅读</string>\n</resources>|' app/src/mobile/res/values-zh-rCN/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd webhtv-src
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --parallel 2>&1 | tail -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: webhtv-src/app/build/outputs/apk/mobile/arm64_v8a/release/*.apk
