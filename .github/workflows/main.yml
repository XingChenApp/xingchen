name: Build XingChen APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: XingChen-APK
          path: app/build/outputs/apk/mobile/release/*.apk
      - name: Create Release
        run: |
          TAG="v1.0.1-${{ github.run_number }}"
          echo "TAG=$TAG" >> $GITHUB_ENV
          gh release create "$TAG" \
            --title "星辰 $TAG" \
            --notes "自动构建" \
            app/build/outputs/apk/mobile/release/*.apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
