name: Build XingChen APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        run: |
          git clone --depth 1 https://github.com/webhtv/webhtv.git /tmp/webhtv-src
          echo "Source cloned"
      - name: Download app icons
        run: |
          curl -L -o /tmp/icons.zip "https://muse.ai/files/1392977643892470/1423151855987498/w5hsnxpzh2wycxzt12qztve4/xingchen-icons.zip"
          mkdir -p /tmp/icons
          unzip -q -o /tmp/icons.zip -d /tmp/icons
          find /tmp/webhtv-src/app/src/main/res -name "ic_launcher*" -delete
          cp -r /tmp/icons/* /tmp/webhtv-src/app/src/main/res/
          echo "App icons installed"
      - name: Download clean patch
        run: |
          curl -L -o /tmp/clean_patch.py "https://muse.ai/files/1392977643892470/1610388783883047/ek70ugt10e5z2eah4unwowgd/xingchen-clean-patch.py"
          echo "Clean patch downloaded"
      - name: Apply clean patch
        run: |
          python3 /tmp/clean_patch.py
          echo "Clean patch applied"
      - name: Apply settings redesign
        run: |
          curl -L -o /tmp/settings_write.py "https://muse.ai/files/1392977643892470/1703392884767586/2zg8qycl4q21v70dzuol8yy0/xingchen-settings-write.py"
          curl -L -o /tmp/java_clean.py "https://muse.ai/files/1392977643892470/1114866537707694/1v8b0d7zol2ga9jvr3d0w4m2/xingchen-java-clean.py"
          curl -L -o /tmp/webhtv-src/app/src/mobile/res/drawable/poster_shanjian.jpg "https://muse.ai/files/1392977643892470/1083558877863244/qg89nof9apezu1r8elvehynk/poster_shanjian_blur.jpg"
          python3 /tmp/settings_write.py
          python3 /tmp/java_clean.py
          echo "Settings redesign applied"
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build APK
        run: |
          cd /tmp/webhtv-src
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: /tmp/webhtv-src/app/build/outputs/apk/mobileArm64_v8a/release/*.apk
