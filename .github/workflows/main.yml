name: Build FongMi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract source
        run: |
          curl -L -o part-00.gz https://github.com/w18455615921/xingchen/releases/download/v1.0/fongmi-src-part-00.gz
          curl -L -o part-01.gz https://github.com/w18455615921/xingchen/releases/download/v1.0/fongmi-src-part-01.gz
          cat part-00.gz part-01.gz > fongmi-tv-src.tar.gz
          tar -xzf fongmi-tv-src.tar.gz
          ls fongmi-tv/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Mobile Debug APK
        working-directory: fongmi-tv
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleMobileDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-apk
          path: fongmi-tv/app/build/outputs/apk/mobile/debug/*.apk
