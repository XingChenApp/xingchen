name: Build XingChen APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo tools
        uses: actions/checkout@v4
        with:
          path: repo-tools
      - name: Checkout source
        run: |
          git clone --depth 1 https://github.com/webhtv/webhtv.git /tmp/webhtv-src
          echo "Source cloned"
      - name: Download app icons
        run: |
          cp "$GITHUB_WORKSPACE/repo-tools/tools/xingchen-icons.zip" /tmp/icons.zip
          mkdir -p /tmp/icons
          unzip -q -o /tmp/icons.zip -d /tmp/icons
          find /tmp/webhtv-src/app/src/main/res -name "ic_launcher*" -delete
          cp -r /tmp/icons/* /tmp/webhtv-src/app/src/main/res/
          echo "App icons installed"
      - name: Download clean patch
        run: |
          cp "$GITHUB_WORKSPACE/repo-tools/tools/xingchen-clean-patch.py" /tmp/clean_patch.py
          echo "Clean patch ready"
      - name: Apply clean patch
        run: |
          python3 /tmp/clean_patch.py
          echo "Clean patch applied"
      - name: Apply settings redesign
        run: |
          cp "$GITHUB_WORKSPACE/repo-tools/tools/xingchen-settings-write.py" /tmp/settings_write.py
          cp "$GITHUB_WORKSPACE/repo-tools/tools/xingchen-java-clean.py" /tmp/java_clean.py
          # Auto-blur wallpaper during build
          pip install Pillow -q
          python3 -c "
          from PIL import Image, ImageFilter
          import sys
          src = '$GITHUB_WORKSPACE/repo-tools/tools/poster_shanjian.jpg'
          dst = '/tmp/webhtv-src/app/src/mobile/res/drawable/poster_shanjian.jpg'
          try:
              img = Image.open(src)
              blurred = img.filter(ImageFilter.GaussianBlur(radius=25))
              blurred.save(dst, 'JPEG', quality=85)
              print('Wallpaper blurred')
          except Exception as e:
              print(f'Blur failed: {e}, using pre-blurred')
              import shutil
              shutil.copy('$GITHUB_WORKSPACE/repo-tools/tools/poster_shanjian_blur.jpg', dst)
          "
          for icon in ic_nav_live ic_nav_reading ic_nav_setting; do
            cp "$GITHUB_WORKSPACE/repo-tools/tools/drawable/${icon}.xml" /tmp/webhtv-src/app/src/mobile/res/drawable/${icon}.xml
          done
          cp "$GITHUB_WORKSPACE/repo-tools/tools/drawable/ic_nav_home.xml" /tmp/webhtv-src/app/src/mobile/res/drawable/ic_nav_vod.xml
          ls /tmp/webhtv-src/app/src/mobile/res/drawable/ic_nav_vod.xml
          ls /tmp/webhtv-src/app/src/mobile/res/drawable/ic_nav_live.xml
          ls /tmp/webhtv-src/app/src/mobile/res/drawable/ic_nav_setting.xml
          echo "Nav icons installed"
          python3 /tmp/settings_write.py
          python3 /tmp/java_clean.py
          echo "Settings redesign applied"
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build APK
        run: |
          cd /tmp/webhtv-src
          chmod +x gradlew
          ./gradlew :app:assembleMobileArm64_v8aRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xingchen-apk
          path: /tmp/webhtv-src/app/build/outputs/apk/mobileArm64_v8a/release/*.apk
