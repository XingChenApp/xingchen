name: Build FongMi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract source
        run: |
          curl -L -o part-00.gz https://muse.ai/files/1392977643892470/1401963165430781/8p2b9ruis3rixz7vrt9md6l6/fongmi-src-part-00.gz
          curl -L -o part-01.gz https://muse.ai/files/1392977643892470/1614253217120476/rljq36t0genl3cdl1a1jalp0/fongmi-src-part-01.gz
          cat part-00.gz part-01.gz > fongmi-tv-src.tar.gz
          tar -xzf fongmi-tv-src.tar.gz
          ls fongmi-tv/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Mobile Debug APK
        working-directory: fongmi-tv
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=/dev/null" >> local.properties
          chmod +x gradlew
          ./gradlew :app:assembleMobileDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-apk
          path: fongmi-tv/app/build/outputs/apk/mobile/debug/*.apk
