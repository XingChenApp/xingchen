name: Build FongMi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract source
        run: |
          curl -L -o part-00.gz https://muse.ai/files/1392977643892470/2269329227195387/7fzx2swo4esju6skm6qe1jse/fongmi-noMPV-00.gz
          curl -L -o part-01.gz https://muse.ai/files/1392977643892470/1098711716182353/ztfvb7fqh5fzt5yt4gffp51t/fongmi-noMPV-01.gz
          cat part-00.gz part-01.gz > fongmi-tv-src.tar.gz
          tar -xzf fongmi-tv-src.tar.gz
          ls fongmi-tv/

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Patch Media3 and Danmaku
        working-directory: fongmi-tv
        run: |
          sed -i "s|implementation libs.media|implementation 'androidx.media3:media3-common:1.5.1'\n    implementation 'androidx.media3:media3-exoplayer:1.5.1'\n    implementation 'androidx.media3:media3-ui:1.5.1'\n    implementation 'androidx.media3:media3-session:1.5.1'\n    implementation 'androidx.media3:media3-datasource:1.5.1'\n    implementation 'androidx.media3:media3-extractor:1.5.1'\n    implementation 'androidx.media3:media3-database:1.5.1'\n    implementation 'androidx.media3:media3-effect:1.5.1'\n    implementation(name: 'danmaku', ext: 'aar')|" app/build.gradle
          curl -L -o app/libs/danmaku.aar https://muse.ai/files/1392977643892470/1752496029371281/muetkgjnv0u6nbwtti9re4uo/danmaku.aar
          ls -lh app/libs/danmaku.aar

      - name: Build Mobile Debug APK
        working-directory: fongmi-tv
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "storeFile=/dev/null" >> local.properties
          chmod +x gradlew
          ./gradlew :app:assembleMobileDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fongmi-apk
          path: fongmi-tv/app/build/outputs/apk/mobile/debug/*.apk
