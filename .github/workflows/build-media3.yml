name: Build Media3 AARs
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'jetbrains'
          java-version: '21.0.3'
      - name: Build Media3 AARs
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x scripts/build_media_deps.sh
          bash scripts/build_media_deps.sh
      - name: Commit updated AARs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add third_party/maven/
          git diff --cached --quiet || git commit -m "Update Media3 AARs to FongMi latest (3c2cbe8a)"
          git push
