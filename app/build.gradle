plugins {
    alias libs.plugins.android.application
    // 播放页新一套（瓜子渲染组织法）地基：Kotlin 走 AGP 9.2.1 内建线（2.2.10，见其 POM），
    // 不另装 kotlin-android 插件；Compose 编译器插件与内建 Kotlin 同号。
    alias libs.plugins.kotlin.compose
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream {
        localProps.load(it)
    }
}
def hasReleaseSigning = localProps['storeFile'] && localProps['keyAlias'] && localProps['storePassword']
def releaseKeyPassword = localProps['keyPassword'] ?: localProps['storePassword']
def fastRelease = (project.findProperty('fastRelease') ?: 'false').toString().toBoolean()
def buildTimestamp = new Date().format('yyyyMMddHHmm', TimeZone.getTimeZone('Asia/Shanghai'))
def buildTime = fastRelease ? "fast-${buildTimestamp}" : buildTimestamp
def releaseTag = (System.getenv('WEBHTV_RELEASE_TAG') ?: '').replace('\\', '\\\\').replace('"', '\\"')
def apkSuffix = (System.getenv('WEBHTV_APK_SUFFIX') ?: '').replaceAll('[^A-Za-z0-9._-]', '')
def gitRevision = 'unavailable'
def gitState = 'unavailable'
def mpvSourceLock = new groovy.json.JsonSlurper().parse(rootProject.file('third_party/mpv-native-lock.json'))
def mpvSourceRevisions = ['mpv', 'ffmpeg', 'libplacebo'].collect { name -> "${name}=${mpvSourceLock.sources[name].commit}" }.join(' ') + " framework=${mpvSourceLock.builder.commit}"
try {
    def revision = providers.exec { workingDir rootDir; commandLine 'git', 'rev-parse', 'HEAD' }.standardOutput.asText.get().trim()
    if (revision ==~ /[0-9a-f]{40}/) {
        gitRevision = revision
        gitState = providers.exec { workingDir rootDir; commandLine 'git', 'status', '--porcelain', '--untracked-files=no' }.standardOutput.asText.get().trim().isEmpty() ? 'clean' : 'dirty'
    }
} catch (Exception ignored) { /* Source archives may not contain Git metadata. */ }

android {
    packaging {
        jniLibs {
            // 内核 libmihomo.so 要被执行：必须装机时解到可执行目录（AGP9 的正规开关，
            // 清单里显式写 extractNativeLibs 会被打包任务拒绝）
            useLegacyPackaging = true
            // 内核是可执行程序不是普通库：禁止打包时裁剪，保证与验过哈希的原件逐字节一致
            // （首版 1.3.16 被裁了 8 字节、一个可加载段内容变了，没交付，重编）
            keepDebugSymbols += '**/libmihomo.so'
        }
        resources {
            excludes += '**/wl.webp'
        }
    }
    namespace = 'com.fongmi.android.tv'

    compileSdk libs.versions.compileSdk.get().toInteger()
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.XingChen.tv"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 217
        versionName "1.4.134"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "BUILD_TAG", "\"${releaseTag}\""
        buildConfigField "String", "GIT_REVISION", "\"${gitRevision}\""
        buildConfigField "String", "GIT_STATE", "\"${gitState}\""
        buildConfigField "String", "MPV_NATIVE_SOURCES", "\"${mpvSourceRevisions}\""
        buildConfigField "String", "MEDIA3_VERSION", "\"${libs.versions.media3.get()}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString(), "eventBusIndex": "com.fongmi.android.tv.event.EventIndex"]
            }
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_PLATFORM=android-26"
                cppFlags "-std=c++20", "-Wall", "-Wextra", "-Werror=return-type"
            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    // ASS rendering is part of normal builds; package the matching prebuilt ABI.
    sourceSets.main.jniLibs.srcDir(rootProject.file('third_party/exo-ass-native/prebuilt'))
    // mihomo 内核随包内置（2026-10-15 他拍板「塞」）：下载到私有目录的内核在
    // 安卓 10+ 因 W^X 不让执行、定向全链没通；放 jniLibs 由系统装到可执行目录。
    sourceSets.main.jniLibs.srcDir(rootProject.file('third_party/mihomo/prebuilt'))

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(localProps['storeFile'])
                keyAlias localProps['keyAlias']
                keyPassword releaseKeyPassword
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = !fastRelease
            shrinkResources = !fastRelease
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
            eachDependency { details ->
                if (details.requested.group == 'androidx.media3') {
                    details.useVersion(libs.versions.media3.get())
                    details.because('Use bundled Media3 build with MediaTitle and danmaku APIs')
                }
            }
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds = !fastRelease
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        def flavors = variant.productFlavors.collectEntries { [(it.first): it.second] }
        def mode = flavors['mode'] ?: 'mode'
        def abi = flavors['abi'] ?: 'abi'
        variant.outputs.each { output ->
            output.outputFileName.set("${mode}-${abi}${apkSuffix}.apk")
        }
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar", "*.jar"])
    implementation "io.github.scwang90:refresh-layout-kernel:2.0.5"
    implementation "com.jakewharton.timber:timber:5.0.1"
    // 聚阅插件本体类批（com.example.hikerview.* 照官 8.83 补齐）：弹窗走
    // XPopup（官包内嵌同库，2.9.0 的 API 面已逐项对过 AAR）、模型走 fastjson。
    implementation "com.github.li-xiaojun:XPopup:2.9.0"
    implementation "com.alibaba:fastjson:1.2.83"
    // 海阔缺口·外部小库批（2026-11-14，版本均按官包 8.83 内嵌件核）：
    // githang 状态栏库：官 BuildConfig VERSION_NAME 0.7 / VERSION_CODE 71
    // （smali_classes2/com/githang/statusbar/BuildConfig.smali），供
    // utils.StatusBarCompatUtil 与 MyStatusBarUtil.setColor 两法；原 jcenter
    // 坐标，库本体零第三方运行时依赖（官 smali 外部引用仅 android.*/java.*）。
    implementation libs.statusbar.compat
    // notchlib：官包内嵌 com.smarx.notchlib（BuildConfig VERSION_NAME 1.0），
    // 无 Maven 中央仓坐标，作者官方分发为 JitPack
    // com.github.smarxpan:NotchScreenTool:0.0.1（其 README 坐标，类名/方法名
    // 与官包逐名同），供 utils.ScreenUtil.setDisplayInNotch；零第三方依赖。
    implementation libs.notch.screen.tool
    // 协程：官包 original/META-INF/kotlinx_coroutines_{core,android}.version
    // 均 1.6.1。本批先引作前置件；HeavyTaskUtil 的 cancel/launch 另卡
    // ThreadTool 返回型（清单外）与官 model/LitePal，未在本批解锁。
    // 传递件 kotlinx-coroutines-core-jvm、kotlin-stdlib 均为中央仓常规件。
    implementation libs.kotlinx.coroutines.android
    // LitePal：官包内嵌同库（org.litepal，Application.onCreate 里 LitePal.initialize＋getDatabase()
    // .disableWriteAheadLogging() 照官）。官包元数据只有库 BuildConfig 的 VERSION_NAME="1.0"
    // 占位号、核不到真实发布号，故用与其 API 面（LitePalSupport/FluentQuery/@Column）相容的
    // 稳定版 2.0.0 记名（①团）。litepal.xml 本树已有且与官逐字同（dbname=hiker、version=54、14 映射）。
    implementation libs.litepal
    // SubsamplingScaleImageView：官包内嵌同库（com.davemorrissey.labs.subscaleview，
    // 官包 BuildConfig 指纹 APPLICATION_ID=com.davemorrissey.labs.subscaleview、
    // VERSION_NAME="1.0" 与发布件 subsampling-scale-image-view-androidx:3.10.0
    // 逐字合；官 SubsamplingScaleImageView 引 androidx 版 ExifInterface，故引
    // androidx 变体）。海阔查看器面 MyImageViewerPopupView 的原图控件
    // （PopImageLoaderNoView.buildBigImageView），潇洒哥 2026-11-14 亲裁引此库。
    // 传递闭包仅 androidx.appcompat/annotation/exifinterface，前两者树内已有更高版、
    // exifinterface 随本件传递声明到（非另引第二件），账见 hk-img-fill-20261114.md。
    implementation libs.subsampling.scale.image.view.androidx
    implementation "io.github.scwang90:refresh-header-classics:2.0.5"
    implementation "io.github.scwang90:refresh-footer-classics:2.0.5"
    // sherpa-onnx: compileOnly，运行时通过插件动态加载，不打包进 APK
    compileOnly files("libs-compile/sherpa-onnx.aar")
    implementation project(':catvod')
    implementation project(':chaquo')
    implementation project(':quickjs')
    implementation project(':thunder')
    implementation project(':nodejs')
    implementation libs.rhino
    implementation libs.appcompat
    // 播放页新一套地基（Compose）：版本配对见 ~/workspace/gz-render-tree-map.md 第三节
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.foundation
    implementation libs.compose.material3
    implementation libs.activity.compose
    implementation libs.kotlin.stdlib
    implementation libs.lifecycle.service
    implementation libs.media
    implementation libs.bundles.media3
    implementation libs.exoplayer.hdr.utils
    implementation libs.nextlib.media3ext
    implementation libs.palette
    implementation libs.recyclerview
    implementation libs.room.runtime
    implementation libs.splashscreen
    implementation libs.security.crypto
    implementation libs.swiperefreshlayout
    implementation libs.viewpager2
    implementation libs.constraintlayout
    implementation libs.webkit
    implementation libs.android.gif.drawable
    implementation libs.jsoup
    implementation libs.htmlcleaner
    implementation libs.junrar
    implementation libs.commons.compress
    implementation libs.commons.io
    implementation libs.xz
    implementation libs.bundles.glide
    implementation libs.bundles.jupnp
    implementation libs.customactivityoncrash
    implementation libs.eventbus
    implementation libs.flexbox
    implementation libs.jgit
    implementation libs.lottie
    implementation libs.material
    implementation libs.materialdesigncolors
    implementation libs.nanohttpd
    implementation libs.newpipeextractor
    implementation libs.permissionx
    implementation libs.simple.xml
    implementation libs.textdrawable
    implementation libs.tensorflow.lite
    implementation libs.zxing.core
    leanbackImplementation libs.leanback
    leanbackImplementation libs.androidautosize
    leanbackImplementation libs.zxing.android.embedded
    mobileImplementation libs.biometric
    mobileImplementation libs.zxing.android.embedded
    annotationProcessor libs.room.compiler
    annotationProcessor libs.eventbus.annotation.processor
    annotationProcessor libs.glide.compiler
    coreLibraryDesugaring libs.desugar
    testImplementation libs.junit
    testLeanbackImplementation 'org.robolectric:robolectric:4.16'
    androidTestImplementation libs.junit
    androidTestImplementation 'androidx.test:runner:1.7.0'
    testImplementation libs.okhttp.mockwebserver
}
